# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#74a0f1)"
error_symbol   = "[   ](bold fg:#446cb4)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#446cb4 fg:#f7f7f8"
truncation_length = 12
format = "󰜥 [](bold fg:#446cb4)[$symbol $branch]($style)[ ](bold fg:#446cb4)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1c2d4a fg:#f7f7f8"
format = '[](bold fg:#1c2d4a)[󰉋 $path]($style)[](bold fg:#1c2d4a)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#74a0f1 fg:#f7f7f8"
format = '[](bold fg:#74a0f1)[󰪢 $duration]($style)[](bold fg:#74a0f1)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#335085 fg:#f7f7f8"
format = "[](bold fg:#335085)[•$hostname]($style)[](bold fg:#335085)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#182740 fg:#f7f7f8"
format = "[](bold fg:#182740)[$user]($style)[](bold fg:#182740)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#0940a5 fg:#e4e5e7"
format = '[](bold fg:#0940a5)[$symbol ($virtualenv)]($style)[](bold fg:#0940a5)'

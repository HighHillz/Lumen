# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#74f1e0)"
error_symbol   = "[   ](bold fg:#45b5a6)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#45b5a6 fg:#f7f8f8"
truncation_length = 12
format = "󰜥 [](bold fg:#45b5a6)[$symbol $branch]($style)[ ](bold fg:#45b5a6)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1d4c46 fg:#f7f8f8"
format = '[](bold fg:#1d4c46)[󰉋 $path]($style)[](bold fg:#1d4c46)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#74f1e0 fg:#f7f8f8"
format = '[](bold fg:#74f1e0)[󰪢 $duration]($style)[](bold fg:#74f1e0)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#33877c fg:#f7f8f8"
format = "[](bold fg:#33877c)[•$hostname]($style)[](bold fg:#33877c)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#19423c fg:#f7f8f8"
format = "[](bold fg:#19423c)[$user]($style)[](bold fg:#19423c)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#09a58f fg:#e4e7e6"
format = '[](bold fg:#09a58f)[$symbol ($virtualenv)]($style)[](bold fg:#09a58f)'

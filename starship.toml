# No newline at start
add_newline = false

format = """
$cmd_duration 󰜥 $directory $python $git_branch
$character"""

# --------------------------
# CHARACTER (PROMPT SYMBOL)
# --------------------------
[character]
success_symbol = "[   ](bold fg:#74c0f1)"
error_symbol   = "[   ](bold fg:#478cb9)"

# --------------------------
# GIT BRANCH
# --------------------------
[git_branch]
symbol = "󰘬"
style = "bg:#478cb9 fg:#f7f7f8"
truncation_length = 12
format = "󰜥 [](bold fg:#478cb9)[$symbol $branch]($style)[ ](bold fg:#478cb9)"

# --------------------------
# DIRECTORY
# --------------------------
[directory]
home_symbol = "  "
read_only = "  "
style = "bg:#1e3d50 fg:#f7f7f8"
format = '[](bold fg:#1e3d50)[󰉋 $path]($style)[](bold fg:#1e3d50)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# --------------------------
# CMD DURATION
# --------------------------
[cmd_duration]
min_time = 0
style = "bg:#74c0f1 fg:#f7f7f8"
format = '[](bold fg:#74c0f1)[󰪢 $duration]($style)[](bold fg:#74c0f1)'

# --------------------------
# HOSTNAME
# --------------------------
[hostname]
style = "bg:#356a8b fg:#f7f7f8"
format = "[](bold fg:#356a8b)[•$hostname]($style)[](bold fg:#356a8b)"
ssh_only = false
disabled = false

# --------------------------
# USERNAME
# --------------------------
[username]
style_user = "bold bg:#1b3546 fg:#f7f7f8"
format = "[](bold fg:#1b3546)[$user]($style)[](bold fg:#1b3546)"
show_always = true

# --------------------------
# PACKAGE
# --------------------------
[package]
disabled = true

# --------------------------
# PYTHON VENV
# --------------------------
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
symbol = ""
style = "bg:#0968a5 fg:#e4e6e7"
format = '[](bold fg:#0968a5)[$symbol ($virtualenv)]($style)[](bold fg:#0968a5)'
